<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #2E251F;
    background: radial-gradient(120% 100% at 50% 0%, #5A4A3E 0%, #2E251F 70%);
    font-family: 'Jost', system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #root { width: 100%; height: 100%; }
  textarea, input { font-family: inherit; }
  textarea:focus, input:focus { border-color: var(--primary) !important; }
  button { font-family: inherit; }
  ::selection { background: rgba(226,143,143,0.3); }

  .dt-press { transition: transform .12s ease; }
  .dt-press:active { transform: scale(0.975); }
  .dt-tap { transition: opacity .15s ease, background .15s ease; }
  .dt-tap:active { opacity: 0.6; }

  @keyframes dtFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes dtUp { from { transform: translateY(46px); } to { transform: translateY(0); } }
  @keyframes dtIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* tidy scrollbars inside the phone */
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
